name: Deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /calculus-textbook

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Jupyter Book
        run: python -m pip install -r requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/package-lock.json

      - name: Install widget dependencies
        run: npm ci --prefix demos

      - name: Test widgets
        run: npm test --prefix demos

      - name: Bundle widgets
        run: npm run build --prefix demos

      - name: Build book
        run: jupyter book build --html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
